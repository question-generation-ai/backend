<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="-200 -200 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" x="-200" y="-200" fill="white"/>
  
  <!-- Axes -->
  <line x1="-200" y1="0" x2="200" y2="0" stroke="#000" stroke-width="2"/>
  <line x1="0" y1="-200" x2="0" y2="200" stroke="#000" stroke-width="2"/>
  
  <!-- Graph of y = mx + b -->
  <line x1="-200" y1="{{-200 * slope + yIntercept * 50}}" x2="200" y2="{{200 * slope + yIntercept * 50}}" 
        stroke="#00ff00" stroke-width="3"/>
  
  <!-- Equation -->
  <text x="-180" y="-180" font-family="Arial" font-size="16" font-weight="bold">
    y = 2x + 1
  </text>
</svg>
