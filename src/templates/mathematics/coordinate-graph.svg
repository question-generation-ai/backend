<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Axes -->
  <line x1="200" y1="0" x2="200" y2="400" stroke="{{axisColor}}" stroke-width="2"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="{{axisColor}}" stroke-width="2"/>
  
  <!-- Axis Labels -->
  <text x="390" y="195" font-family="Arial" font-size="14" fill="{{textColor}}">{{xLabel}}</text>
  <text x="205" y="15" font-family="Arial" font-size="14" fill="{{textColor}}">{{yLabel}}</text>
  
  <!-- Grid Numbers -->
  <text x="220" y="180" font-family="Arial" font-size="12" fill="{{textColor}}">1</text>
  <text x="240" y="195" font-family="Arial" font-size="12" fill="{{textColor}}">1</text>
  <text x="180" y="180" font-family="Arial" font-size="12" fill="{{textColor}}">-1</text>
  <text x="160" y="195" font-family="Arial" font-size="12" fill="{{textColor}}">-1</text>
  
  <!-- Function Plot Area -->
  <path d="{{functionPath}}" fill="none" stroke="{{functionColor}}" stroke-width="3"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="{{titleColor}}">{{title}}</text>
  
  <!-- Points -->
  <circle cx="{{point1X}}" cy="{{point1Y}}" r="4" fill="{{pointColor}}" />
  <circle cx="{{point2X}}" cy="{{point2Y}}" r="4" fill="{{pointColor}}" />
</svg>
